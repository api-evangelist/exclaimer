entries:
- date: '2026-08-10'
  title: Edit personal details in the Add-in
  audience: Users with access to the User Details Editor
  type: addition
  breaking: false
  summary: >-
    Users can update their own personal details (job title, phone number, other
    admin-permitted fields) directly in the Exclaimer Outlook Add-in, with changes
    flowing straight into their signature. Administrators control which fields are
    editable.
- date: '2026-08-03'
  title: Default Signature Source
  audience: Microsoft users
  type: addition
  breaking: false
  summary: >-
    Administrators can choose whether the sender's personal signature or the
    mailbox signature is applied by default when a user sends from a mailbox other
    than their own.
- date: '2026-06-03'
  title: Sent Items for Google Workspace
  audience: All Google Workspace users
  type: addition
  breaking: false
  summary: >-
    Option to insert the signed message into the user's Sent Items folder so the
    applied signature is visible after sending.
- date: '2026-05-05'
  title: UKG Ready integration
  audience: Pro plan
  type: addition
  breaking: false
  summary: >-
    UKG Ready added as an employee data source in Sender Management, powered by
    BindBee, usable instead of or alongside Microsoft Entra ID, Google Directory
    or manual upload.
- date: '2026-04-16'
  title: Workday integration
  audience: Pro plan
  type: addition
  breaking: false
  summary: >-
    Workday added as an HRIS employee data source for signatures and meeting
    themes, powered by BindBee, syncing new hires and job changes automatically.
- date: '2026-03-17'
  title: Assigning users for Meeting Branding
  audience: Resellers
  type: addition
  breaking: false
  summary: >-
    Meeting Branding themes can be assigned to individuals or groups by rule
    rather than applied organization-wide, across Zoom and the UDE download for
    Teams and Google Meet.
- date: '2026-02-09'
  title: Reseller enhancements
  audience: Resellers
  type: addition
  breaking: false
  summary: >-
    Resellers can add employee or external users in the product portal with
    clearer permission control, and can select the hosting region when creating a
    new customer subscription.
- date: '2026-01-20'
  title: Brand Kits
  audience: All users
  type: change
  breaking: false
  summary: >-
    Brand Kits replaces the Branding screen with named collections of branded
    assets that can be applied and switched per signature, managed from a
    centralized Brand Kits list.
