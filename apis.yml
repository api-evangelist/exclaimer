aid: exclaimer
name: Exclaimer
description: >-
  Exclaimer is an email signature management platform used by IT, marketing, and
  sales teams to centrally create, deploy, and govern corporate email signatures
  across Microsoft 365, Microsoft Exchange, and Google Workspace. It manages
  signatures for more than 9 million email accounts, adding campaign banners,
  meeting-branding backgrounds, click-tracking analytics, directory
  synchronization with Azure AD and Google Directory, and role-based access
  control. Exclaimer publishes the Exclaimer Cloud API — a partner/distributor
  provisioning REST API documented at cloudapi.exclaimer.com with a machine-
  readable OpenAPI 3.0.1 definition covering subscriptions, MSP subscriptions,
  subscription users, resellers, end users, mailbox counts, subscription
  transfers and reference data. It operates a multi-region Exclaimer Cloud with
  a real-time status page and a strong security and compliance program (SOC 2
  Type II, ISO 27001/27018, HIPAA, PCI DSS, CSA STAR, Cyber Essentials).
