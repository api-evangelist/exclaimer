apis:
- name: Exclaimer Cloud API
  description: >-
    Partner and distributor provisioning API for Exclaimer Cloud tenants. Covers
    creating and managing subscriptions (add, update, activate, deactivate, end,
    reactivate, migrate, transfer ownership, change SKU/tier/NFR status),
    MSP subscriptions and sender usage export, subscription users and roles,
    resellers, end users, mailbox counts and allocation, and reference data
    (data centers, SKUs, tiers). REST over HTTPS with JSON, authenticated with
    an ExApiToken API key header, PascalCase-or-camelCase request tolerance, and
    ContinuationToken paging. Access is restricted to the Exclaimer distributor
    network; tokens are issued by Exclaimer.
  humanURL: https://cloudapi.exclaimer.com/
  baseURL: https://cloudapi.exclaimer.com/exclaimerapi
