  examples_from_docs:
  - SubscriptionID (the reference uses "sub123" / "sub-1" in examples)
  prefixes_published: false
  note: >-
    Exclaimer publishes no id prefix scheme or format. Ids are declared as plain
    strings with no pattern or format in the specification.

