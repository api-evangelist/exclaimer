description: >-
  The provisioning data model behind the Exclaimer Cloud API. Subscription is the
  root aggregate: everything the partner API does is create a subscription, point
  it at an end user (the customer company) and optionally a reseller, then adjust
  its tier, SKU, seat count, users and ownership over time.

