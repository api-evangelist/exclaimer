          description: The length of time the subscription should be in trial (in days). A value of zero will cause the subscription to be activated with a default length of 14 days.
          format: int32
        SendWelcomeEmailToCustomer:
          type: boolean
          description: Specifies whether an email will be sent to the customer asking them to login for the first time. This defaults to true.
        SubscriptionName:
          type: string
          description: The name of the subscription.
        SubscriptionProductCode:
          type: string
          description: The type of product being requested. If not specified a default of "Office365" will be used. <p> Office365<br /> GSuite </p>
        Tier:
          type: string
          description: '<deprecated-note><em>2023-04-03</em><br /> The ExclaimerCloud and SignatureMarketingSuite tiers have been replaced by ExclaimerStarter, ExclaimerStandard, and ExclaimerPro. For compatibility, existing consumers can continue to use the original tiers, along with the new tiers. New consumers can only use the new tiers. </deprecated-note> If not specified, existing consumers will be assigned "ExclaimerCloud" as a default, and new consumers will be assigned "ExclaimerStandard" as a default. <p> ExclaimerStarter<br /> ExclaimerStandard<br /> ExclaimerPro<br /><deprecated>ExclaimerCloud <deprecated-indicator /><br /></deprecated><deprecated>SignatureMarketingSuite <deprecated-indicator /></deprecated></p><p> Note: Managed-Service-Provider accounts are limited to only creating ExclaimerPro tier subscriptions. </p>'
        EndUser:
