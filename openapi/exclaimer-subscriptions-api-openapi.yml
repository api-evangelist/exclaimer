        curlExamples:
          Change owner based on User ID - cURL:
            description: /subscriptions/EX-Subscription-021/change-owner
            value: '{"UserID":"U7301-JJP-06"}'
          Change owner based on email - cURL:
            description: /subscriptions/EX-Subscription-021/change-owner
            value: '{"EmailAddress":"helen.kirby@example.com"}'
