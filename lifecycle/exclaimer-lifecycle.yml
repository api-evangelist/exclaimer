versioning:
  style: URL path segment
  current: '1.0'
  additional_versions:
  - '2.0'
  detail: >-
    Version is the second segment of the request path
    ([endpoint]/[version]/[resource-or-action]). Version 1.0 carries 38 of the 39
    operations; version 2.0 currently carries a single operation, POST
    /v2.0/subscriptions, the replacement for the deprecated 1.0 subscription
    create. Versions coexist — there is no cutover date published.
  docs: https://cloudapi.exclaimer.com/

deprecation:
  policy_published: true
  policy_url: https://cloudapi.exclaimer.com/?showDeprecatedFeatures=true
  product_lifecycle_url: https://exclaimer.com/support/discontinued/
  mechanism: >-
    Deprecated APIs, properties and examples are annotated in the reference with a
    deprecated indicator, an explanation and a date of change. They are hidden by
    default and revealed with the "Show deprecated features" checkbox or the
    ?showDeprecatedFeatures=true query parameter. The OpenAPI carries the standard
    `deprecated: true` flag on the affected operation.
  compatibility_promise: >-
    Existing consumers may keep using both old and new features until all
    subscriptions have been migrated. New consumers get only the new features and
    receive 400 Bad Request or 404 Not Found when calling deprecated
    functionality.
  sunset_headers: false
  sunset_headers_note: >-
    No RFC 8594 Sunset or Deprecation response headers are declared in the
    specification or documented in the reference; deprecation is communicated
    through documentation and error status only.
  deprecated_operations:
  - method: POST
    path: /1.0/subscriptions
    summary: Add Subscription
    date_of_change: '2025-02-17'
    replacement: POST /v2.0/subscriptions
    reason: >-
      The V2 endpoint provides enhanced support for marketplace scenarios and
      SKU-based product specification.
  deprecated_schemas_flagged:
  - AddSubscription
  - AddSubscriptionV2
  - Subscription
  - UpdateSubscriptionSKU
  - UpdateSubscriptionTier

