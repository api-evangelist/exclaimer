notes: >-
  Supersedes the 2026-07-19 version of this artifact, which recorded "publishes no
  public REST API reference, versioning policy, or deprecation policy". That was
  wrong: the Exclaimer Cloud API reference at cloudapi.exclaimer.com is public and
  server-rendered, carries a written deprecation policy, and ships a machine-
  readable OpenAPI 3.0.1 at cloudapi.exclaimer.com/openapi.json. Only the API
  TOKEN is gated, not the documentation.
