# --- Rate-limit signalling on the one operation that declares 429 ---
- target: $.paths['/1.0/msp/subscriptions/{SubscriptionID}/senders/json'].get.responses['429']
  description: >-
    Document a Retry-After header on the only 429 in the API. Exclaimer publishes
    no limit, window or header, so a client that hits it today has no runtime
    signal to back off against.
  update:
    headers:
      Retry-After:
        description: >-
          RECOMMENDED — not currently returned by Exclaimer. Seconds to wait
          before retrying the sender export.
        schema:
          type: integer

# --- Deprecation signalling ---
- target: $.paths['/1.0/subscriptions'].post.responses
  description: >-
    Recommend RFC 8594 Sunset/Deprecation headers on the deprecated create
    endpoint. Exclaimer's deprecation policy is documentation-only; a machine
    consumer cannot detect deprecation at runtime.
  update:
    '400':
      description: >-
        Bad Request / Missing Field. Also returned to NEW consumers calling this
        deprecated endpoint — use POST /v2.0/subscriptions instead.
