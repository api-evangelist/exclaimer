overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Exclaimer Cloud API
  version: 1.0.0
  x-generated: '2026-08-13'
  x-method: generated
  x-source: >-
    Generated from openapi/_original/exclaimer-cloud-api-openapi.json (fetched
    from https://cloudapi.exclaimer.com/openapi.json on 2026-08-13) plus the
    Introduction/Usage prose on https://cloudapi.exclaimer.com/. Captures the
    enhancements API Evangelist would apply; the original specification is never
    mutated.
extends: ../openapi/_original/exclaimer-cloud-api-openapi.json
actions:

# --- Servers: the published development endpoint is missing from servers[] ---
- target: $
  description: >-
    Add the development endpoint. The reference names two endpoints (Development
    https://sandbox-cloudapi.exclaimer.com and Live https://cloudapi.exclaimer.com)
    but servers[] carries only one, and labels it "Local" rather than "Live".
  update:
    servers:
    - url: https://cloudapi.exclaimer.com/exclaimerapi
      description: Live — production provisioning of Exclaimer Cloud tenants
    - url: https://sandbox-cloudapi.exclaimer.com/exclaimerapi
      description: Development — partner integration sandbox
    - url: https://cloudapi.exclaimer.com/{partnerPrefix}
      description: >-
        Live with a partner-specific path prefix. The reference states a partner
        may be issued a custom endpoint segment such as "yourcompany" in place of
        "exclaimerapi".
      variables:
        partnerPrefix:
          default: exclaimerapi
          description: The path segment issued to your partner account by Exclaimer.

# --- Contact + terms: info block carries none ---
- target: $.info
  description: >-
    Add contact and documentation pointers. The published info block has no
    contact, termsOfService or license, so a consumer parsing the spec has no
    route to support.
  update:
    contact:
      name: Exclaimer Support
      url: https://support.exclaimer.com/hc/en-gb
    x-api-reference: https://cloudapi.exclaimer.com/
    x-documentation-version: '5.2'
    x-documentation-published: '2025-07-23'
    x-access: >-
      Restricted to the Exclaimer distributor network. ExApiToken values are
      issued by Exclaimer out of band; there is no self-service registration.

# --- Tags: the spec declares no top-level tags[] even though every operation is tagged ---
- target: $
  description: >-
    Declare the nine tag groups the operations already use. Without a top-level
    tags[] block, generated documentation and SDKs have no descriptions for the
    groups the reference navigation is built from.
  update:
    tags:
    - name: Subscriptions
      description: Create, read, update and change the lifecycle and commercial state of tenant subscriptions.
    - name: Subscription Users
      description: Manage the humans with portal access to a subscription and their roles.
    - name: Subscription Transfers
      description: Initiate, claim and cancel the movement of a subscription between partners.
    - name: MSP
      description: MSP-type partner operations, including the per-sender usage export.
    - name: End Users
      description: The customer companies that subscriptions belong to.
    - name: Resellers
      description: Resellers in the distribution chain between distributor and end user.
    - name: Mailboxes
      description: Seat accounting — mailbox counts and allocation.
    - name: Reference Resources
      description: Reference data — data centers, SKUs and tiers.
    - name: Miscellaneous
      description: Service status and mailbox allocation.

